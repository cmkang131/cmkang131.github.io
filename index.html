<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>공부 필기 정리</title>
<style>
@font-face{font-family:'Noto Sans KR';src:url('notosanskr-subset.woff') format('woff');font-weight:400 700;font-display:swap}
:root{--ink:#111;--gray:#666;--blue:#1e4f9f}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Noto Sans KR','Apple SD Gothic Neo',system-ui,sans-serif;background:#fff;color:var(--ink)}
.page{max-width:880px;margin:0 auto;background:#fff;padding:34px 60px 90px}
.main{font-size:17px;line-height:1.75}
.phead{display:flex;justify-content:space-between;align-items:baseline;
  font-size:14px;color:var(--gray);padding-bottom:8px;margin-bottom:22px;border-bottom:1px solid var(--ink)}
.phead .course{font-weight:700;color:var(--ink)}
h1.doct{font-size:23px;font-weight:700;margin:6px 0 4px}
.sub{color:var(--gray);font-size:15px;margin-bottom:8px}
.clist{margin:18px 0}
.clist .row{display:flex;gap:14px;align-items:baseline;padding:14px 2px;border-bottom:1px solid #ddd}
.clist .row:last-child{border-bottom:none}
.clist .code{flex:0 0 84px;font-weight:700}
.clist .name{flex:1}
.clist .name .note{color:var(--gray);font-size:14.5px;margin-left:8px}
.clist .st{flex:0 0 auto;font-size:13.5px;border:1px solid #111;padding:1px 9px;color:var(--ink);text-decoration:none}
.clist .st.off{color:var(--gray);border-color:#bbb}
a.row{color:var(--ink);text-decoration:none;display:flex}
@media (max-width:760px){
  .page{padding:22px 18px 60px}
  .main{font-size:16px}
  .clist .code{flex-basis:70px}
}
</style>
</head>
<body>
<div class="page"><div class="main">
<div class="phead"><span class="course">공부 필기 정리</span><span>2026-2</span></div>
<h1 class="doct">공부 필기 정리</h1>
<p class="sub">과목별 개념 정리본 모음</p>
<div class="clist" id="clist"></div>
</div></div>
<script>
// 과목 추가/수정은 아래 목록 한 줄만 편집
// status: live(바로가기) / soon(배포 예정) / prep(준비 중)
const GROUPS = [
  {title:"이번 학기", courses:[
    {code:"MATH432",  name:"수리데이터사이언스", note:"개념 정리본", url:"https://cmkang131.github.io/sudesa-notes/", status:"live"},
    {code:"CSED211",  name:"컴퓨터시스템", note:"개념 정리본 · 중간 10/29", url:"https://cmkang131.github.io/csed211-notes/", status:"live"},
    {code:"CSED331",  name:"알고리즘", note:"개념 정리본 · 중간 10/26", url:"https://cmkang131.github.io/csed331-notes/", status:"live"},
    {code:"CMEF499D", name:"데이터와 경제학 마케팅", note:"특강 · 강의 정리", url:"https://cmkang131.github.io/mkt-notes/", status:"live"},
  ]},
  {title:"과외", courses:[
    {code:"MATH102",  name:"미적분학2", note:"과외", url:"https://cmkang131.github.io/math102-notes/", status:"live"},
  ]},
  {title:"지난 학기", courses:[
    {code:"CSED233",  name:"데이터구조", note:"개념 정리본", url:"https://cmkang131.github.io/csed233-notes/", status:"live"},
    {code:"",         name:"딥러닝", note:"연구 노트", url:"https://cmkang131.github.io/dl-notes/", status:"live"},
    {code:"CSED490E", name:"자연어처리", note:"드랍 · 개념 정리본", url:"https://cmkang131.github.io/nlp-notes/", status:"live"},
    {code:"",         name:"지난 학기 아카이브", note:"MATH101 · CSED101 · 인공지능 · EVSE101 · LIFE103 · 일반물리 · 과사통", url:"https://cmkang131.github.io/past-notes/", status:"live"},
  ]},
  {title:"기타", courses:[
    {code:"EECE274",  name:"디지털시스템설계", note:"친구 과목 · 개념 정리본", url:"https://cmkang131.github.io/eece274-notes/", status:"live"},
  ]},
];
const LABEL = {live:"바로가기 →", soon:"배포 예정", prep:"준비 중"};
const el = document.getElementById('clist');
for (const g of GROUPS) {
  const h = document.createElement('div');
  h.textContent = g.title;
  h.style.cssText = 'margin:22px 0 4px;font-size:13px;font-weight:700;color:#888;letter-spacing:.08em';
  el.appendChild(h);
  for (const c of g.courses) {
    const row = document.createElement(c.status === "live" ? "a" : "div");
    row.className = "row";
    if (c.status === "live") row.href = c.url;
    row.innerHTML =
      '<span class="code">' + c.code + '</span>' +
      '<span class="name">' + c.name + (c.note ? '<span class="note">' + c.note + '</span>' : '') + '</span>' +
      '<span class="st' + (c.status === "live" ? '' : ' off') + '">' + LABEL[c.status] + '</span>';
    el.appendChild(row);
  }
}
</script>
</body>
</html>
